name: Weekly Funnel Analyst

on:
  schedule:
    - cron: '0 15 * * 1'  # Monday 08:00 MST (15:00 UTC)
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests notion-client openai sendgrid python-dotenv
      
      - name: Run funnel analyst
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          BLAKE_EMAIL: ${{ secrets.BLAKE_EMAIL }}
        run: |
          python scripts/funnel_analyst.py
      
      - name: Commit weekly report
        run: |
          git config user.name "Funnel Analyst Bot"
          git config user.email "bot@blake-a11y.com"
          git add reports/
          git diff-index --quiet HEAD || git commit -m "Weekly report $(date +%Y-%m-%d)"
          git push
